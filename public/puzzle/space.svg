<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140a2e"/>
      <stop offset="0.6" stop-color="#3a1460"/>
      <stop offset="1" stop-color="#f0567a"/>
    </linearGradient>
    <radialGradient id="planet" cx="0.35" cy="0.3">
      <stop offset="0" stop-color="#ffd9a0"/>
      <stop offset="1" stop-color="#e0742f"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="0.5" stop-color="#ffb02e"/>
      <stop offset="1" stop-color="#ff4d2e" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="300" height="300" fill="url(#sky)"/>
  <g fill="#fff">
    <circle cx="30" cy="30" r="1.5"/><circle cx="80" cy="60" r="1"/><circle cx="130" cy="20" r="1.3"/>
    <circle cx="260" cy="40" r="1.2"/><circle cx="210" cy="90" r="1"/><circle cx="40" cy="120" r="1.2"/>
    <circle cx="280" cy="150" r="1"/><circle cx="110" cy="110" r="0.9"/><circle cx="170" cy="50" r="1"/>
  </g>
  <!-- ringed planet -->
  <circle cx="78" cy="88" r="40" fill="url(#planet)"/>
  <path d="M42 80 Q78 70 114 82" stroke="#b5521f" stroke-width="4" fill="none" opacity="0.5"/>
  <ellipse cx="78" cy="92" rx="64" ry="14" fill="none" stroke="#ffe3b8" stroke-width="5" transform="rotate(-14 78 92)"/>
  <!-- small moon -->
  <circle cx="246" cy="78" r="16" fill="#cfd6ff"/>
  <circle cx="241" cy="73" r="3.5" fill="#a9b2e8"/><circle cx="252" cy="84" r="2.5" fill="#a9b2e8"/>
  <!-- city skyline -->
  <g fill="#1a0b30">
    <rect x="0" y="236" width="300" height="64"/>
    <rect x="10" y="206" width="24" height="40"/><rect x="40" y="190" width="18" height="56"/>
    <rect x="64" y="214" width="30" height="32"/><rect x="200" y="196" width="22" height="50"/>
    <rect x="228" y="214" width="34" height="32"/><rect x="268" y="184" width="20" height="62"/>
  </g>
  <g fill="#ffd36b">
    <rect x="16" y="214" width="4" height="5"/><rect x="24" y="226" width="4" height="5"/><rect x="45" y="200" width="4" height="5"/>
    <rect x="72" y="222" width="4" height="5"/><rect x="206" y="206" width="4" height="5"/><rect x="236" y="222" width="4" height="5"/>
    <rect x="274" y="196" width="4" height="5"/><rect x="274" y="214" width="4" height="5"/>
  </g>
  <!-- rocket lifting off -->
  <g transform="translate(150 120) rotate(18)">
    <path d="M-9 70 Q0 130 9 70 Z" fill="url(#flame)"/>
    <path d="M-16 40 L-30 72 L-12 64 Z" fill="#e23b4e"/>
    <path d="M16 40 L30 72 L12 64 Z" fill="#e23b4e"/>
    <path d="M0 -40 Q22 -10 16 66 L-16 66 Q-22 -10 0 -40 Z" fill="#f4f1ff"/>
    <path d="M0 -40 Q12 -26 15 -14 L-15 -14 Q-12 -26 0 -40 Z" fill="#e23b4e"/>
    <circle cx="0" cy="10" r="8" fill="#5ab3f0" stroke="#3a4a7a" stroke-width="3"/>
    <rect x="-12" y="58" width="24" height="8" rx="2" fill="#3a4a7a"/>
  </g>
</svg>
