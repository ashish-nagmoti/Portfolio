<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1340"/>
      <stop offset="0.55" stop-color="#2b2f7a"/>
      <stop offset="1" stop-color="#e2836b"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.4" cy="0.4">
      <stop offset="0" stop-color="#fffbe6"/>
      <stop offset="1" stop-color="#f3d98b"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b3a7a"/>
      <stop offset="1" stop-color="#0c1033"/>
    </linearGradient>
  </defs>
  <rect width="300" height="300" fill="url(#sky)"/>
  <!-- stars -->
  <g fill="#fff">
    <circle cx="24" cy="30" r="1.4"/><circle cx="70" cy="18" r="1"/><circle cx="110" cy="44" r="1.6"/>
    <circle cx="150" cy="22" r="1"/><circle cx="40" cy="78" r="1.1"/><circle cx="96" cy="96" r="0.9"/>
    <circle cx="132" cy="70" r="1.2"/><circle cx="20" cy="120" r="1"/><circle cx="268" cy="140" r="1"/>
    <circle cx="180" cy="60" r="0.9"/><circle cx="286" cy="24" r="1.3"/><circle cx="60" cy="140" r="0.8"/>
  </g>
  <!-- moon with a wizard crossing it -->
  <circle cx="218" cy="78" r="70" fill="url(#glow)"/>
  <circle cx="218" cy="78" r="40" fill="url(#moon)"/>
  <circle cx="204" cy="66" r="6" fill="#ead27a" opacity="0.6"/>
  <circle cx="230" cy="92" r="4" fill="#ead27a" opacity="0.5"/>
  <g fill="#0d1030" transform="translate(186 70) rotate(-8)">
    <path d="M0 14 L62 9" stroke="#0d1030" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M60 6 L74 3 L75 16 L61 12 Z"/>
    <path d="M22 4 Q38 2 50 12 L32 16 Z"/>
    <path d="M18 2 Q24 0 28 6 L30 15 L20 16 Z"/>
    <circle cx="18" cy="-3" r="4.5"/>
  </g>
  <!-- far mountains -->
  <path d="M0 200 L40 160 L72 186 L110 148 L150 190 L190 156 L228 188 L262 160 L300 192 L300 300 L0 300 Z" fill="#26245e"/>
  <!-- castle -->
  <g fill="#120f33">
    <rect x="70" y="150" width="20" height="70"/>
    <path d="M66 150 L80 118 L94 150 Z"/>
    <rect x="96" y="170" width="70" height="50"/>
    <rect x="112" y="132" width="24" height="88"/>
    <path d="M108 132 L124 92 L140 132 Z"/>
    <rect x="170" y="158" width="18" height="62"/>
    <path d="M166 158 L179 128 L192 158 Z"/>
    <rect x="192" y="178" width="46" height="42"/>
    <rect x="218" y="146" width="16" height="74"/>
    <path d="M214 146 L226 120 L238 146 Z"/>
    <path d="M96 170 h8 v-6 h8 v6 h8 v-6 h8 v6 h8 v-6 h8 v6 h8 v-6 h8 v6 h8 v-6 h4 v6"/>
  </g>
  <!-- lit windows -->
  <g fill="#ffd36b">
    <rect x="77" y="164" width="5" height="8" rx="2"/><rect x="77" y="184" width="5" height="8" rx="2"/>
    <rect x="121" y="146" width="6" height="10" rx="3"/><rect x="121" y="170" width="6" height="10" rx="3"/>
    <rect x="104" y="186" width="5" height="8" rx="2"/><rect x="146" y="186" width="5" height="8" rx="2"/>
    <rect x="176" y="172" width="5" height="8" rx="2"/><rect x="200" y="190" width="5" height="8" rx="2"/>
    <rect x="223" y="160" width="5" height="8" rx="2"/><rect x="223" y="182" width="5" height="8" rx="2"/>
  </g>
  <!-- lake and reflections -->
  <rect x="0" y="220" width="300" height="80" fill="url(#lake)"/>
  <g fill="#ffd36b" opacity="0.45">
    <rect x="76" y="232" width="7" height="2" rx="1"/><rect x="120" y="240" width="9" height="2" rx="1"/>
    <rect x="175" y="236" width="7" height="2" rx="1"/><rect x="222" y="244" width="7" height="2" rx="1"/>
  </g>
  <g stroke="#fff6cf" stroke-linecap="round" opacity="0.55">
    <path d="M198 232 H238" stroke-width="2"/><path d="M204 246 H232" stroke-width="1.6"/><path d="M210 260 H226" stroke-width="1.2"/>
  </g>
  <!-- foreground trees -->
  <g fill="#070820">
    <path d="M0 300 L0 210 L14 238 L22 214 L34 244 L44 222 L58 260 L64 300 Z"/>
    <path d="M300 300 L300 214 L286 240 L278 220 L266 248 L256 230 L244 264 L240 300 Z"/>
  </g>
</svg>
